<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#ff8fb5" />
    <link rel="icon" href="assets/cozypops-logo.png" />
    <link rel="stylesheet" href="css/styles.css" />
    <title>Shop | CozyPops</title>
  </head>
  <body>
    <div id="site-header"></div>
    <main>
      <section class="page-head">
        <div class="wrap">
          <span class="eyebrow">🎀 Squishy shelf</span>
          <h1>Shop All Squishies</h1>
          <p class="sub">
            Browse what’s available, viral, low stock or open for preorder.
          </p>
        </div>
      </section>
      <section class="section-sm" style="padding-top: 10px">
        <div class="wrap">
          <div class="filters">
            <input
              class="searchbox"
              id="search"
              placeholder="Search for your next squishy... 🔎"
            /><select class="select" id="category">
              <option value="all">All categories</option>
              <option>Food Squishies</option>
              <option>Animals</option>
              <option>Characters</option>
              <option>Mini Squishies</option>
              <option>Jumbo Squishies</option></select
            ><select class="select" id="sort">
              <option value="default">Sort: Featured</option>
              <option value="newest">Newest</option>
              <option value="price-low">Price Low → High</option>
              <option value="price-high">Price High → Low</option>
            </select>
          </div>
          <div class="chip-row">
            <button class="chip active" data-filter="all">All</button
            ><button class="chip" data-filter="new">✨ New</button
            ><button class="chip" data-filter="viral">🔥 Viral</button
            ><button class="chip" data-filter="instock">💗 In Stock</button
            ><button class="chip" data-filter="low">⚠️ Low Stock</button
            ><button class="chip" data-filter="preorder">🎀 Preorder</button
            ><button class="chip" data-filter="sold">Sold Out</button>
          </div>
          <div class="result-count" id="resultCount"></div>
          <div class="product-grid" id="shopGrid"></div>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <script src="js/products.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
