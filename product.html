<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#ff8fb5" />
    <link rel="icon" href="assets/cozypops-logo.png" />
    <link rel="stylesheet" href="css/styles.css" />
    <title>Squishy | CozyPops</title>
  </head>
  <body>
    <div id="site-header"></div>
    <main>
      <div class="wrap product-detail" id="productDetail"></div>
      <section class="review-section">
        <div class="wrap">
          <div class="center">
            <span class="eyebrow">💗 Customer reviews</span>
            <h2 class="title">Squishy Reviews</h2>
          </div>
          <div class="review-layout">
            <div class="rating-panel">
              <span class="rating-number">4.9</span>
              <div class="stars" style="font-size: 22px">★★★★★</div>
              <p class="muted" id="reviewCount">Reviews</p>
              <div class="review-list" id="reviewList"></div>
            </div>
            <form class="review-form" id="reviewForm">
              <h3 style="font-family: Fredoka; font-size: 25px; margin-top: 0">
                Leave a little review ♡
              </h3>
              <label>Your name</label
              ><input id="reviewName" placeholder="Name or nickname" /><label
                >Your rating</label
              >
              <div class="star-input">
                <button type="button" class="on">★</button
                ><button type="button" class="on">★</button
                ><button type="button" class="on">★</button
                ><button type="button" class="on">★</button
                ><button type="button" class="on">★</button>
              </div>
              <label>Your review</label
              ><textarea
                id="reviewText"
                required
                placeholder="How was the squishy?"
              ></textarea
              ><button class="btn-primary" type="submit">Post Review 💗</button>
              <p class="muted" style="font-size: 12px">
                Static demo: reviews are saved in this browser only.
              </p>
            </form>
          </div>
        </div>
      </section>
      <section class="section-sm">
        <div class="wrap center">
          <span class="eyebrow">✨ You may also like</span>
          <h2 class="title">Related Squishies</h2>
          <div class="product-grid" id="relatedProducts"></div>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <script src="js/products.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
